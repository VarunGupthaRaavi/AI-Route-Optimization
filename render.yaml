services:
  # ----------------------------------------------------
  # 1. Backend Web Service (FastAPI + AsyncPG / Supabase)
  # ----------------------------------------------------
  - type: web
    name: routeai-backend
    env: python
    region: singapore # or oregon / frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ----------------------------------------------------
  - type: web
    name: routeai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: routeai-backend
          property: url
